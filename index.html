<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gerador de padronagem — Especialização em Design Gráfico</title>
<link rel="stylesheet" href="assets/fonts/host-grotesk.css">
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>

<!-- Barra de ferramentas. Vira bandeja no rodapé em telas estreitas —
     é só a direção do flex que muda; a marcação é a mesma. -->
<aside class="barra">

  <!-- O logo é injetado por js/logo.js. Não fica escrito aqui porque
       precisa estar inline no DOM (para o CSS pintar via currentColor) e,
       ao mesmo tempo, ter uma fonte única em assets/logo/logo.svg. -->
  <div class="marca" id="marca" aria-hidden="true"></div>

  <div class="divisor"></div>

  <div class="ferramentas" role="group" aria-label="Grelha">

    <button type="button" class="bt" id="bt-grelha"
            aria-pressed="true" title="Exibir grelha" aria-label="Exibir grelha">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18"/>
        <path d="M9 3v18M15 3v18M3 9h18M3 15h18"/>
      </svg>
    </button>

    <button type="button" class="bt" id="bt-densidade-mais"
            title="Aumentar densidade da grelha — ou rolar para cima sobre a tela"
            aria-label="Aumentar densidade da grelha">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path d="M12 5v14M5 12h14"/>
      </svg>
    </button>

    <div class="leitura" id="leitura-densidade" role="status"
         aria-label="Colunas da grelha">12</div>

    <button type="button" class="bt" id="bt-densidade-menos"
            title="Diminuir densidade da grelha — ou rolar para baixo sobre a tela"
            aria-label="Diminuir densidade da grelha">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path d="M5 12h14"/>
      </svg>
    </button>

  </div>

  <div class="divisor"></div>

  <div class="ferramentas" role="group" aria-label="Edição">
    <button type="button" class="bt" id="bt-borracha"
            aria-pressed="false"
            title="Borracha — clicar na tela esvazia a célula"
            aria-label="Modo borracha">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
           stroke-linejoin="round" aria-hidden="true">
        <path d="M8.2 19 3.9 14.7a1.7 1.7 0 0 1 0-2.4l8.4-8.4a1.7 1.7 0 0 1 2.4 0l5.4 5.4a1.7 1.7 0 0 1 0 2.4L13.4 19z"/>
        <path d="M8.2 19H20.5"/>
        <path d="M8.9 7.7 16.3 15.1"/>
      </svg>
    </button>
  </div>

  <!-- Sempre no fim da barra: embaixo no vertical, à direita na bandeja. -->
  <div class="ferramentas ao-fim" role="group" aria-label="Exportação">
    <button type="button" class="bt" id="bt-exportar"
            title="Exportar a padronagem" aria-label="Exportar a padronagem">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3v11"/>
        <path d="M7.5 10 12 14.5 16.5 10"/>
        <path d="M4 17.5v2A1.5 1.5 0 0 0 5.5 21h13a1.5 1.5 0 0 0 1.5-1.5v-2"/>
      </svg>
    </button>
  </div>
</aside>

<!-- Área de desenho. Ocupa todo o resto da viewport.
     O viewBox é ajustado ao tamanho em pixels a cada redimensionamento. -->
<svg class="tela" id="tela" xmlns="http://www.w3.org/2000/svg"
     preserveAspectRatio="none" role="img"
     aria-label="Área de composição da padronagem">
  <!-- Ordem importa. A padronagem é o desenho; o realce responde ao cursor e
       precisa ser visível mesmo sobre uma célula já preenchida; a grelha é
       guia de construção e fica por cima de tudo. -->
  <path id="padronagem" d=""/>
  <rect id="realce" class="oculto" x="0" y="0" width="0" height="0"/>
  <path id="grelha" d=""/>
</svg>

<!-- Diálogo de exportação. <dialog> nativo: dá foco preso, Esc para fechar e
     fundo modal sem uma linha de JS, e funciona em file://. -->
<dialog id="dialogo" class="dialogo" aria-labelledby="dialogo-titulo">
  <form id="form-exportar" method="dialog">
    <h2 id="dialogo-titulo">Exportar padronagem</h2>

    <fieldset>
      <legend>Formato</legend>
      <label class="opcao">
        <input type="radio" name="formato" value="svg" checked>
        <span><b>SVG</b> — vetor, escalável, abre no Illustrator</span>
      </label>
      <label class="opcao">
        <input type="radio" name="formato" value="png">
        <span><b>PNG</b> — imagem, fundo transparente</span>
      </label>
    </fieldset>

    <fieldset id="opcoes-png" hidden>
      <legend>Definir pelo…</legend>
      <div class="linha">
        <label class="opcao compacta">
          <input type="radio" name="dimensao" value="largura" checked>
          <span>Largura</span>
        </label>
        <label class="opcao compacta">
          <input type="radio" name="dimensao" value="altura">
          <span>Altura</span>
        </label>
        <input type="number" id="valor-dimensao" value="2000" min="16" max="16000" step="1"
               aria-label="Medida em pixels">
        <span class="unidade">px</span>
      </div>
    </fieldset>

    <p class="resumo" id="resumo" role="status"></p>

    <menu>
      <button type="button" class="bt-texto" id="bt-cancelar">Cancelar</button>
      <button type="submit" class="bt-texto primario" id="bt-confirmar" value="exportar">Exportar</button>
    </menu>
  </form>
</dialog>

<script src="js/logo.js"></script>
<script src="js/grelha.js"></script>
<script src="js/elementos.js"></script>
<script src="js/exportar.js"></script>
<script src="js/app.js"></script>
</body>
</html>
