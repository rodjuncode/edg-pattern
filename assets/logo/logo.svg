  <!-- Extraído da brand sheet original (Julio Giacomelli). A versão reduzida da folha
       é esta mesma geometria escalada por 0,30101 — por isso um arquivo só atende as duas.

       Cor: o `color` no elemento raiz é apenas o padrão de quando o arquivo é aberto
       sozinho. Inline em uma página, qualquer regra CSS de `color` tem precedência.
       O grupo #detalhe (paralelogramo + DESIGN) aceita uma segunda cor pela custom
       property edg-logo-detalhe, declarada no atributo fill logo abaixo. Sem ela,
       o logo fica monocromático. -->

